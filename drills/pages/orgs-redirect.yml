id: orgs-redirect
title: Escritórios legacy route (redirect into Settings)
path: /orgs
redirectsTo: /settings/offices
mode: steps
areas: []
steps:
  - id: redirects-to-settings-offices
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      Navigating to /orgs no longer renders a standalone page - the browser is
      redirected and the URL shown is /settings/offices.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: url-matches
      pattern: /settings/offices
  - id: lands-on-offices-page
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the redirect the real destination is rendered - the "Escritórios"
      heading is on the page.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: text-contains
      text: Escritórios
  - id: redirect-is-clean
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The redirect is clean - no flash of an empty page or an error banner on
      the way through, and the settings tab bar ends up highlighting the
      Escritórios tab that was actually landed on.
    tags:
      - ux
      - navigation
    judgment: false
    spec: tests/drills/orgs-redirect.spec.ts#redirect-is-clean
    assertion:
      kind: url-matches
      pattern: /settings/offices
      mode: contains
  - id: no-console-errors
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      Navigating to /orgs produces no browser console errors and no failed
      network requests on the way to its destination.
    tags:
      - quality
    judgment: false
    spec: tests/drills/orgs-redirect.spec.ts#no-console-errors
    assertion:
      kind: url-matches
      pattern: /settings/offices
      mode: contains
