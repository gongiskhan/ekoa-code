id: knowledge
title: O que a Ekoa sabe (knowledge base)
path: /knowledge
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page shows the "O que a Ekoa sabe" heading with its subtitle about
      sourced, citable documents.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: O que a Ekoa sabe
  - id: learned-button-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The "O que a Ekoa aprendeu" button is present in the page header.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      role: button
      name: O que a Ekoa aprendeu
  - id: explainer-banner-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The explainer banner "Os agentes da Ekoa usam esta base primeiro." is
      shown above the tabs.
    tags:
      - functionality
      - ux
    judgment: false
    assertion:
      kind: text-contains
      text: Os agentes da Ekoa usam esta base primeiro.
  - id: tabs-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The tab row offers Fornecido, Fontes and Documentos.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: text-contains
      text: Fontes
  - id: fornecido-empty-state
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      On the default "Fornecido" tab with no documents, the page shows the
      centred empty state "Ainda não há documentos nesta base." with the hint
      pointing at «Documentos» and «Fontes», plus the "Todas" filter chip - not
      a blank panel.
    tags:
      - functionality
      - ux
    judgment: false
    spec: tests/drills/knowledge.spec.ts#fornecido-empty-state
    assertion:
      kind: text-contains
      text: Ainda não há documentos nesta base.
  - id: fornecido-list-resolves
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The "Fornecido" panel settles into a real result - either document entries
      or the written empty state. It must not be left on the centred "A
      carregar..." spinner beneath the "Todas" filter chip once the page has
      loaded; a spinner that never resolves is a failure, and it is
      indistinguishable to the user from a knowledge base that silently lost its
      contents.
    tags:
      - functionality
      - loading
    judgment: false
    spec: tests/drills/knowledge.spec.ts#fornecido-list-resolves
    assertion:
      kind: text-contains
      text: Ainda não há documentos nesta base.
  - id: loading-state-does-not-leak-across-tabs
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, switching to the "Fontes" tab shows that tab's own
      content - the "Adicionar fonte" form and the list of configured sources. A
      stray "A carregar..." left over from the Fornecido panel must not still be
      sitting in the page header area while a different tab is selected.
    actions:
      - id: __act-0
        description: click the "Fontes" tab
        resolved:
          kind: click
          role: tab
          name: Fontes
    tags:
      - functionality
      - loading
      - ux
    judgment: false
    spec: tests/drills/knowledge.spec.ts#loading-state-does-not-leak-across-tabs
    assertion:
      kind: visible
      role: heading
      name: Adicionar fonte
  - id: fontes-tab-shows-add-source-form
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the "Fontes" tab is selected and its "Adicionar fonte"
      form is shown with Nome, Coleção and URL fields, the "Níveis de links",
      "Âmbito" and "Máx. páginas" controls, and the "Renderizar com navegador
      (JS/SPA)" checkbox.
    actions:
      - id: __act-0
        description: click the "Fontes" tab
        resolved:
          kind: click
          role: tab
          name: Fontes
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/knowledge.spec.ts#fontes-tab-shows-add-source-form
    assertion:
      kind: visible
      role: heading
      name: Adicionar fonte
  - id: documentos-tab-renders
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the "Documentos" tab is selected and shows its
      document-upload interface (or a clear empty state) - never a blank panel
      or a panel still showing the Fontes form.
    actions:
      - id: __act-0
        description: click the "Documentos" tab
        resolved:
          kind: click
          role: tab
          name: Documentos
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/knowledge.spec.ts#documentos-tab-renders
    assertion:
      kind: visible
      role: heading
      name: Carregar documentos
  - id: add-source-validates-url
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the actions - opening Fontes and submitting the add-source form with
      a name but no URL - the form does not silently accept it; it either blocks
      submission with visible validation feedback on the URL field or keeps the
      submit control disabled.
    actions:
      - id: __act-0
        description: click the "Fontes" tab
        resolved:
          kind: click
          role: tab
          name: Fontes
      - id: __act-1
        description: fill the "Nome" field with "Fonte de teste"
        resolved:
          kind: fill
          role: textbox
          name: Nome
          value: Fonte de teste
      - id: __act-2
        description: click the "Adicionar fonte" submit control
        resolved:
          kind: click
          role: button
          name: Adicionar fonte
    tags:
      - functionality
      - validation
    judgment: false
    spec: tests/drills/knowledge.spec.ts#add-source-validates-url
    assertion:
      kind: text-contains
      text: Indique o URL e a coleção.
  - id: learned-panel-opens
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the "O que a Ekoa aprendeu" control opens a panel or
      view showing what the agents have learned - it does not leave the page
      unchanged or produce an error.
    actions:
      - id: __act-0
        description: click the "O que a Ekoa aprendeu" button
        resolved:
          kind: click
          role: button
          name: O que a Ekoa aprendeu
    tags:
      - functionality
    judgment: false
    spec: tests/drills/knowledge.spec.ts#learned-panel-opens
    assertion:
      kind: url-matches
      pattern: /memory
      mode: contains
  - id: page-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page is visually coherent - the tinted explainer banner is clearly a
      callout distinct from body copy, the tab row with its icons is evenly
      spaced and the active tab is unmistakably marked, and the content area
      below keeps the same left margin as the header.
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/knowledge.spec.ts#page-polish
  - id: source-form-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      On the Fontes tab the add-source form is well laid out - the Nome/Coleção
      pair and the Níveis de links / Âmbito / Máx. páginas trio align on shared
      rows, helper text sits under its own field, and no field or its hint text
      overflows the card.
    actions:
      - id: __act-0
        description: click the "Fontes" tab
        resolved:
          kind: click
          role: tab
          name: Fontes
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/knowledge.spec.ts#source-form-polish
