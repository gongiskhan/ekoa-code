id: automations-new
title: Nova automatização (create form)
path: /automations/new
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page shows the "Nova automatização" heading with its explanatory
      subtitle.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Nova automatização
    assertionSource: authored
  - id: objective-field-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The required "Objetivo (obrigatório)" textarea is present.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      label: Objetivo (obrigatório)
    assertionSource: authored
  - id: name-field-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The optional "Nome (opcional)" input is present.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      label: Nome (opcional)
    assertionSource: authored
  - id: cancel-button-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The "Cancelar" button is present.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      role: button
      name: Cancelar
    assertionSource: authored
  - id: draft-disabled-when-empty
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: With the objective empty, the "Esboçar passos" submit button is disabled.
    tags:
      - functionality
      - validation
    judgment: false
    assertion:
      kind: attribute-equals
      role: button
      name: Esboçar passos
      attribute: disabled
      value: ''
    assertionSource: authored
  # This check was graduated to a pinned assertion that asserted the button was DISABLED - the
  # exact opposite of its own criterion. Verified live at authoring time: with the objective
  # empty, attribute-equals disabled="" passes; once the objective is filled it fails, because
  # the attribute is gone. None of the five assertion kinds can express "this control is
  # enabled", so the check belongs in the behavioural lane and the inverted assertion and the
  # spec generated from it are removed.
  - id: draft-enables-after-objective
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the "Esboçar passos" button is enabled (no longer greyed
      out / disabled) once an objective has been typed.
    actions:
      - id: __act-0
        description: >-
          fill the "Objetivo (obrigatório)" field with "Abrir o site da empresa
          e tirar um screenshot"
        resolved:
          kind: fill
          role: textbox
          name: Objetivo (obrigatório)
          value: Abrir o site da empresa e tirar um screenshot
    tags:
      - functionality
      - validation
    judgment: false
  - id: cancel-returns-to-list
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the browser is back on /automations showing the
      automations list page.
    actions:
      - id: __act-0
        description: click the "Cancelar" button
        resolved:
          kind: click
          role: button
          name: Cancelar
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/automations-new.spec.ts#cancel-returns-to-list
    # Anchored: the loose "contains /automations" pattern also matched /automations/new, so the
    # check passed whether or not Cancelar navigated anywhere. Verified live at authoring time -
    # after clicking Cancelar the URL is exactly /automations and this regex passes.
    assertion:
      kind: url-matches
      pattern: /automations$
      mode: regex
    assertionSource: authored
  - id: form-layout-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The form reads as a tidy single column - labels sit directly above their
      fields, the placeholder example text in the objective textarea is legible,
      and the Cancelar / Esboçar passos buttons are right-aligned on one row
      without wrapping or misalignment.
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/automations-new.spec.ts#form-layout-polish
  - id: s1785347957948-1
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >
      create an automation that searches for ekoa ai on google and visits the
      first page, then takes a screenshot and sends it via email to
      goncalo.p.gomes@gmail.com Make sure this automation works end to end and
      all states are visible and correct.
    tags: []
    judgment: true
  - id: s1785348441480-1
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The create form is served at its own route - the browser stays on
      /automations/new rather than being redirected back to the list.
    tags:
      - navigation
    judgment: false
    spec: tests/drills/automations-new.spec.ts#s1785348441480-1
    assertion:
      kind: url-matches
      pattern: /automations/new
      mode: contains
    assertionSource: authored
  - id: s1785351740689-2
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      Interacting with the draft form does not navigate away - the browser is
      still on /automations/new after the form has been filled in.
    tags:
      - navigation
    judgment: false
    spec: tests/drills/automations-new.spec.ts#s1785351740689-2
    assertion:
      kind: url-matches
      pattern: /automations/new
      mode: contains
    assertionSource: authored
spotter:
  stability: {}
  rules: []
