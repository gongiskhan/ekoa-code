id: usage
title: Utilização (token consumption)
path: /usage
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page shows the "Utilização" heading with its subtitle about per-user
      token consumption and limit management.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Utilização
  - id: table-headers-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The usage table renders its column headers, including UTILIZADOR.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: UTILIZADOR
  - id: last-login-column-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The table includes the "ÚLTIMO INÍCIO DE SESSÃO" column.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: ÚLTIMO INÍCIO DE SESSÃO
  - id: reset-action-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: Each user row offers a "Repor" (reset quota) action.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      role: button
      name: Repor
  - id: current-user-row-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The signed-in admin account appears as a row in the usage table.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: admin
  - id: last-login-reflects-session
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The "ÚLTIMO INÍCIO DE SESSÃO" cell for the signed-in admin shows a real
      timestamp, since this very run logged in as that account. It must not read
      "nunca".
    tags:
      - functionality
      - data
    judgment: false
  - id: quota-figures-consistent
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      For each row the USADO, RESTANTE and % values are mutually consistent -
      the percentage matches used against the total quota, and the remaining
      figure equals the quota minus what was used.
    tags:
      - functionality
      - data
    judgment: true
    spec: tests/drills/usage.spec.ts#quota-figures-consistent
  - id: reset-confirms-before-acting
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, pressing "Repor" does not silently wipe the quota - it
      either asks for confirmation first or gives clear visible feedback that
      the quota was reset (and the row's USADO / % update accordingly).
    actions:
      - id: __act-0
        description: click the "Repor" button on the admin row
        resolved:
          kind: click
          role: button
          name: Repor
    tags:
      - functionality
      - ux
    judgment: false
    spec: tests/drills/usage.spec.ts#reset-confirms-before-acting
    assertion:
      kind: visible
      role: dialog
      name: Repor consumo de admin?
  - id: table-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The usage table looks clean - numeric columns are right-aligned, the
      percentage badge is consistently styled, the header row is visually
      distinct from the body, and the table card does not stretch awkwardly wide
      relative to its content.
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/usage.spec.ts#table-polish
  - id: table-resolves
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The consumption table settles into a real result - per-user rows with
      their quota figures. The page must not stop at its heading and subtitle
      with nothing but blank space where the table belongs, and must not still
      be showing a skeleton or spinner once it has settled.
    tags:
      - functionality
      - loading
    judgment: false
    spec: tests/drills/usage.spec.ts#table-resolves
    assertion:
      kind: visible
      selector: table
  - id: usage-empty-state-is-a-lie
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page never states that no users exist. At minimum the signed-in admin
      has an account and has consumed tokens, so "Nenhum utilizador encontrado."
      is always false on this screen. A read that did not return must be shown
      as a failure the user can retry.
    tags:
      - functionality
      - error-handling
      - data-integrity
    judgment: false
    spec: tests/drills/usage.spec.ts#usage-empty-state-is-a-lie
    assertion:
      kind: visible
      selector: table tr td
  - id: origin-breakdown-section-present
    area: 0
    mode: e2e
    enabled: false
    viewports:
      - desktop
    state: default
    description: >-
      The "Consumo por origem" section renders below the per-user table, with
      its subtitle explaining it breaks the current period's consumption down by
      origin.
    tags:
      - functionality
    judgment: false
    authoringObservation:
      kind: snapshot
      receipts:
        - observation-efbc4ab5bfb7-0026
    assertion:
      kind: text-contains
      text: Consumo por origem
    assertionSource: authored
    planGuard:
      status: quarantined
      reason: observation-receipt-mismatch
  - id: origin-breakdown-rows-coherent
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      When consumption exists, each row of the "Consumo por origem" table names
      its origin and carries a token figure and a percentage, and the
      percentages across the rows account for the whole (they sum to roughly
      100%). A row with a blank origin, a missing figure, or percentages that
      plainly cannot describe the same total is inconsistent data. With no
      consumption yet, an explicit empty state in Portuguese is the acceptable
      alternative.
    tags:
      - functionality
      - data
    judgment: true
    spec: tests/drills/usage.spec.ts#origin-breakdown-rows-coherent
  - id: failed-load-is-not-silent
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      When the consumption data cannot be loaded, this page SAYS SO. A failed
      read must surface as a visible Portuguese error with a way to retry -
      never as the empty illustration and "Nenhum utilizador encontrado." on
      their own, which tell the user a confident, wrong answer with no way to
      tell it is wrong.
    tags:
      - functionality
      - error-handling
      - ux
    judgment: false
