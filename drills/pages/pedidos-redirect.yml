id: pedidos-redirect
title: Pedidos legacy route (redirect into Settings)
path: /pedidos
redirectsTo: /settings/pedidos
mode: steps
areas: []
steps:
  - id: redirects-to-settings-pedidos
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      Navigating to /pedidos no longer renders a standalone page: the browser is
      redirected to /settings/pedidos and lands on the Pedidos tab inside
      Settings - the settings tab bar ("Plataforma" / "Pedidos", with "Pedidos"
      active) is visible above the "Pedidos" heading and its Escritório/Estado
      filter bar, and the URL shown is /settings/pedidos, not /pedidos.
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/pedidos-redirect.spec.ts#redirects-to-settings-pedidos
    assertion:
      kind: url-matches
      pattern: /settings/pedidos
      mode: contains
  - id: lands-on-pedidos-page
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the redirect the real destination is rendered - the "Pedidos"
      heading is on the page, not an empty shell.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: text-contains
      text: Pedidos
  - id: pedidos-tab-is-the-active-one
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The redirect lands inside the Settings tab bar, with the "Pedidos" tab
      present alongside Plataforma, Utilizadores and Escritórios - the legacy
      route resolves to a tab of Settings rather than to a detached page that
      happens to share the heading.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: visible
      role: tab
      name: Pedidos
  - id: redirect-is-clean
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The redirect is clean - no flash of an empty page, a login form or an
      error banner on the way through, and the settings tab bar ends up visually
      highlighting Pedidos, the tab actually landed on, rather than leaving no
      tab marked active.
    tags:
      - ux
      - navigation
    judgment: false
    spec: tests/drills/pedidos-redirect.spec.ts#redirect-is-clean
    assertion:
      kind: attribute-equals
      selector: '[role=''tab'']:nth-child(2)'
      attribute: aria-selected
      value: 'true'
  - id: destination-content-resolves
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      Arriving through the legacy route loads the destination's data just like a
      direct visit does - the Pedidos list settles into either change-request
      rows or a written empty state, and does not stay parked on "A carregar
      pedidos...".
    tags:
      - functionality
      - loading
    judgment: false
    spec: tests/drills/pedidos-redirect.spec.ts#destination-content-resolves
    assertion:
      kind: text-contains
      text: Sem pedidos de alteração.
  - id: no-console-errors
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      Navigating to /pedidos produces no browser console errors and no failed
      network requests on the way to its destination.
    tags:
      - quality
    judgment: false
    spec: tests/drills/pedidos-redirect.spec.ts#no-console-errors
    assertion:
      kind: url-matches
      pattern: /settings/pedidos
      mode: contains
spotter:
  stability:
    step-end:
      decision: drop
      runs: 1
      lastRunId: 01KYPET5MMPF4J2J9N47XEEE8C
      annotation: >-
        Same post-redirect Pedidos state as frame-0031; redundant step-end
        duplicate.
  rules: []
