id: pedidos
title: Pedidos (change requests, Settings tab)
path: /settings/pedidos
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page shows the "Pedidos" heading with its subtitle about change
      requests sent by users from the apps.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Pedidos
  - id: state-filter-defaults-open
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The "Estado" filter defaults to "Abertos" (open requests).
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Abertos
  - id: empty-state-message
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      With no change requests, the page shows the "Sem pedidos de alteração."
      empty state.
    tags:
      - functionality
      - ux
    judgment: false
    assertion:
      kind: text-contains
      text: Sem pedidos de alteração.
  - id: office-filter-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The office scope filter ("Todos os escritórios") is present in the filter
      bar.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Todos os escritórios
  - id: state-filter-switches-view
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, switching the "Estado" filter away from "Abertos"
      reloads the list for the newly selected state - the content area updates
      (a different set of requests or a matching empty message) rather than
      staying frozen on the previous result.
    actions:
      - select a different option in the "Estado" dropdown
    tags:
      - functionality
      - filtering
    judgment: false
  - id: empty-state-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The empty state is centred with its icon above the message and reads as
      deliberate design rather than a page that failed to load; the filter bar
      above it spans the same width as the page header.
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/pedidos.spec.ts#empty-state-polish
  - id: request-row-actions
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: populated
    description: >-
      With at least one change request present, each entry shows who sent it,
      which app it came from and when, plus the two actions the page description
      promises - converting it into a review and dismissing it.
    tags:
      - functionality
    judgment: true
  - id: settings-tab-bar-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      A settings tab bar sits above the page header with exactly four tabs -
      "Plataforma", "Pedidos", "Utilizadores" and "Escritórios" - and "Pedidos"
      is the active tab (highlighted with the active underline) - this page now
      lives as a tab inside Settings, not as a standalone page.
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/pedidos.spec.ts#settings-tab-bar-visible
    assertion:
      kind: count
      role: tab
      op: eq
      value: 4
  - id: tab-switch-to-platform
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the app has navigated to the platform settings tab: the
      URL is /settings/platform, the "Configurações da Plataforma" heading has
      replaced the Pedidos queue, and the same tab bar remains visible with
      "Plataforma" now the active tab.
    actions:
      - id: __act-0
        description: click the "Plataforma" tab
        resolved:
          kind: click
          role: tab
          name: Plataforma
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/pedidos.spec.ts#tab-switch-to-platform
    assertion:
      kind: url-matches
      pattern: /settings/platform
      mode: contains
  - id: sidebar-has-no-pedidos-entry
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the expanded left navigation rail lists NO "Pedidos"
      entry anywhere (the queue is reached only through Settings now); the rail
      shows entries such as Chat, Automatizações, Artefactos, Integrações,
      Memória, Utilizadores, Registo and Configurações, and "Configurações" is
      the highlighted active section while on this page.
    actions:
      - id: __act-0
        description: click the "Alternar barra lateral" button to expand the sidebar
        resolved:
          kind: click
          role: button
          name: Alternar barra lateral
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/pedidos.spec.ts#sidebar-has-no-pedidos-entry
    assertion:
      kind: visible
      role: link
      name: Configurações
  - id: list-resolves
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The change-request list settles into a real result - either request rows
      or the written empty state ("Sem pedidos de alteração."). It must NOT
      still be showing "A carregar pedidos..." once the page has settled.
    tags:
      - functionality
      - loading
    judgment: false
    spec: tests/drills/pedidos.spec.ts#list-resolves
    assertion:
      kind: text-contains
      text: Sem pedidos de alteração.
  - id: settings-tabs-named
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The settings tab bar offers the "Utilizadores" tab alongside Plataforma,
      Pedidos and Escritórios.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: visible
      role: tab
      name: Utilizadores
  - id: settings-tabs-offices
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The settings tab bar offers the "Escritórios" tab.
    tags:
      - functionality
      - navigation
    judgment: false
    assertion:
      kind: visible
      role: tab
      name: Escritórios
  - id: empty-state-not-shown-beside-an-error
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      "Sem pedidos de alteração." is shown only when the queue was actually read
      and found empty - never at the same time as a load error. This queue
      genuinely IS empty on a fresh stack, which is exactly what makes the
      combination dangerous here: the reassuring empty state is correct by
      accident while the request behind it failed, so an administrator cannot
      tell "no one has requested anything" from "we could not find out". When
      the read fails the page must show the error alone and withhold the empty
      state.
    tags:
      - functionality
      - error-handling
      - data-integrity
    judgment: false
    spec: tests/drills/pedidos.spec.ts#empty-state-not-shown-beside-an-error
    assertion:
      kind: text-contains
      text: Sem pedidos de alteração.
  - id: load-error-is-in-portuguese
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      A failure to load the change-request queue is reported in Portuguese and
      in human terms, offering the retry - not as a raw English developer string
      quoting a millisecond timeout. (Observed defect at authoring time - the
      banner read literally "Request timed out after 120000ms", in English,
      beside a Portuguese "Tentar novamente" link.) NOTE 2026-08-05: the
      authoring-time observation behind this check was a dev-harness artifact (a
      leaking CORS proxy), not a product hang - the page renders normally in a
      clean browser. The CHECK stands: web/lib/api/core.ts really can surface a
      raw English timeout string and a failed read really must not render as an
      empty state, so this is kept as the guard for those paths.
    tags:
      - i18n
      - error-handling
      - ux
    judgment: false
    spec: tests/drills/pedidos.spec.ts#load-error-is-in-portuguese
    assertion:
      kind: visible
      role: main
states:
  - id: populated
    label: At least one change request exists
    reachPath:
      - id: submit-request
        description: >-
          submit a change request from one of the served apps so that it appears
          in this list; if no such request can be created in this environment,
          skip the state
spotter:
  stability:
    step-end:
      decision: drop
      runs: 1
      lastRunId: 01KYPET5MMPF4J2J9N47XEEE8C
      annotation: Identical to frame-0000; redundant step-end boundary capture.
  rules: []
