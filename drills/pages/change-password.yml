    state: default
    description: >-
      After the actions, entering a new password and a different confirmation
      does not change the password - the page shows a clear message that the two
      do not match ("As palavras-passe não coincidem") and keeps the submit
      disabled, and does not report success. Graduated from vision to a
      deterministic spec: a vision pass could see the submit fire only when a
      repair step re-typed a matching confirmation, which is the harness acting,
      not the page accepting a mismatch.
    actions:
      - id: __act-0
        description: fill the "Palavra-passe Atual" field with "tmp12345"
        resolved:
          kind: fill
          role: textbox
          name: Palavra-passe Atual
          value: tmp12345
      - id: __act-1
        description: fill the "Nova Palavra-passe" field with "novaSenha123"
