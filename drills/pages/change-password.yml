states:
  - id: forced
    label: >-
      First-login forced password change (holds for the seeded admin on a
      freshly booted stack; once the change has been completed the page shows
      the optional variant instead)
    reachPath:
      - id: seeded-admin
        description: >-
          sign in as an account that still carries the first-login
          password-change requirement (on a freshly booted dev stack the seeded
          "admin" / "tmp12345" is in exactly this state), so the card renders
          with the "Deve alterar a palavra-passe antes de continuar" subtitle
  - id: optional
    label: Optional password change, reached from inside the app
    reachPath:
      - id: account-without-flag
        description: >-
          sign in as an account that does NOT owe a password change (an account
          whose first-login password change has already been completed), so the
          card renders without the forced-change warning
      - id: open-change-password
        description: navigate to /change-password from inside the authenticated app
