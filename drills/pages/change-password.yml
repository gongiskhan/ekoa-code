id: change-password
title: Alterar Palavra-passe
path: /change-password
mode: steps
# This route renders TWO variants of the same card:
#   voluntary (the default) - subtitle "Atualize a palavra-passe da sua conta", with a
#     "Voltar ao Dashboard" escape link;
#   forced - subtitle "Deve alterar a palavra-passe antes de continuar", with a "Terminar
#     sessao" control in place of the escape link. The dev stack seeds `admin` in exactly
#     this state on every fresh boot, so it is a real user-facing screen, not a corner case.
# Both variants share the fields, the strength meter and the requirement checklist.
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The page shows the "Alterar Palavra-passe" heading with its "Atualize a palavra-passe da sua conta" subtitle.
    tags: [functionality]
    judgment: false
    assertion: { kind: text-contains, text: "Alterar Palavra-passe" }
    assertionSource: authored
  - id: current-password-field
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Palavra-passe Atual" field is present - changing the password requires proving knowledge of the current one.
    tags: [functionality, security]
    judgment: false
    assertion: { kind: visible, label: "Palavra-passe Atual" }
    assertionSource: authored
  - id: new-password-field
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Nova Palavra-passe" field is present.
    tags: [functionality]
    judgment: false
    assertion: { kind: visible, label: "Nova Palavra-passe" }
    assertionSource: authored
  - id: confirm-password-field
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Confirmar Nova Palavra-passe" field is present.
    tags: [functionality]
    judgment: false
    assertion: { kind: visible, label: "Confirmar Nova Palavra-passe" }
    assertionSource: authored
  - id: submit-disabled-when-empty
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: With the form empty, the "Atualizar Palavra-passe" button is disabled.
    tags: [functionality, validation]
    judgment: false
    assertion: { kind: attribute-equals, role: button, name: "Atualizar Palavra-passe", attribute: disabled, value: "" }
    assertionSource: authored
  - id: back-link-present
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Voltar ao Dashboard" escape link is present so the user is never trapped on this page.
    tags: [functionality, navigation]
    judgment: false
    assertion: { kind: visible, role: link, name: "Voltar ao Dashboard" }
    assertionSource: authored
  - id: all-fields-have-reveal-toggle
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: Each of the three password fields offers its own "Mostrar palavra-passe" reveal toggle.
    tags: [ux, accessibility]
    judgment: false
    assertion: { kind: count, role: button, name: "Mostrar palavra-passe", op: gte, value: 3 }
    assertionSource: authored
  - id: mismatch-rejected
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, entering a new password and a different confirmation does not change the password - the page shows a clear message that the two do not match (or keeps the submit disabled), and does not report success.
    actions:
      - fill the "Palavra-passe Atual" field with "tmp12345"
      - fill the "Nova Palavra-passe" field with "novaSenha123"
      - fill the "Confirmar Nova Palavra-passe" field with "outraSenha456"
      - click the "Atualizar Palavra-passe" button
    tags: [functionality, validation, security]
    judgment: false
  - id: wrong-current-password-rejected
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, submitting a wrong current password produces a clear error and leaves the password unchanged. The error must not disclose whether the account exists or reveal any stored value.
    actions:
      - fill the "Palavra-passe Atual" field with "estaEstaErrada999"
      - fill the "Nova Palavra-passe" field with "novaSenha123"
      - fill the "Confirmar Nova Palavra-passe" field with "novaSenha123"
      - click the "Atualizar Palavra-passe" button
    tags: [functionality, security]
    judgment: false
  - id: reveal-toggle-works
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, pressing the reveal toggle on the "Nova Palavra-passe" field switches that field from dots to readable plaintext, and only that field - the other two stay masked.
    actions:
      - fill the "Nova Palavra-passe" field with "novaSenha123"
      - click the "Mostrar palavra-passe" toggle on the "Nova Palavra-passe" field
    tags: [ux]
    judgment: false
  - id: back-link-returns-to-app
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, "Voltar ao Dashboard" navigates back into the authenticated app (the dashboard chrome with its sidebar), not to the login screen.
    actions:
      - click the "Voltar ao Dashboard" link
    tags: [functionality, navigation]
    judgment: false
  - id: card-polish
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: The centred card on the dark branded background is well composed - the shield icon, heading and subtitle stack tightly, the three fields share equal width and spacing with a divider isolating the current-password field from the new pair, and the footer wordmark sits clear of the card.
    tags: [visual, polish]
    judgment: true
  - id: requirement-checklist-spelling
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      After the actions, the password requirement checklist appears and every line is spelled
      correctly in pt-PT, with its diacritics: "Pelo menos 8 caracteres", "Uma letra maiúscula",
      "Uma letra minúscula", "Um número". (Observed at authoring time - three of the four are
      written without accents: "maiuscula", "minuscula", "numero".)
    actions:
      - fill the "Nova Palavra-passe" field with "NovaSenha123"
    tags: [content, i18n, polish]
    judgment: false
  - id: requirement-checklist-tracks-input
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, the requirement checklist reflects what has actually been typed - a password that satisfies only some rules ticks only those, so the list is live guidance rather than decoration.
    actions:
      - fill the "Nova Palavra-passe" field with "abc"
    tags: [functionality, ux]
    judgment: false
  - id: strength-meter-responds
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, the strength meter under "Nova Palavra-passe" rates a strong password visibly higher than a weak one, with a Portuguese label (e.g. "Forte"), and the bar segments fill to match the label rather than contradicting it.
    actions:
      - fill the "Nova Palavra-passe" field with "abc"
      - fill the "Nova Palavra-passe" field with "Drill#Temp2026"
    tags: [functionality, ux]
    judgment: false
  - id: submit-completes-not-hangs
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      After the actions, submitting a valid password change resolves - the button returns from its
      spinner to a settled state and the page reports either success or a specific error. A submit
      button left spinning indefinitely with no message is a failure, not a slow success.
      (Observed at authoring time - the button spins forever and nothing is ever reported.)
    actions:
      - fill the "Palavra-passe Atual" field with "tmp12345"
      - fill the "Nova Palavra-passe" field with "Drill#Temp2026"
      - fill the "Confirmar Nova Palavra-passe" field with "Drill#Temp2026"
      - click the "Atualizar Palavra-passe" button
    tags: [functionality, loading]
    judgment: false
  - id: forced-variant-copy
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: forced
    description: In the forced variant the subtitle explains why the user is here - "Deve alterar a palavra-passe antes de continuar" - and it is styled as a warning rather than as ordinary body text, so the user understands this is a requirement and not an optional settings page.
    tags: [content, ux]
    judgment: false
  - id: forced-variant-hides-back-link
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: forced
    description: In the forced variant the "Voltar ao Dashboard" escape link is NOT offered - the whole point is that the user cannot skip the change - and a sign-out control is offered in its place so they still have a way out.
    tags: [functionality, security]
    judgment: false
  - id: forced-signout-actually-works
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: forced
    description: >-
      After the action, the sign-out control on the forced variant actually ends the session and
      lands the user on the login screen. This is the only exit from this screen, so if it does
      nothing the user is trapped with no way to leave.
      (Observed at authoring time - clicking it does nothing at all: the page stays put and the
      session survives.)
    actions:
      - click the "Terminar sessao" control
    tags: [functionality, security]
    judgment: false
  - id: forced-signout-label-spelling
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: forced
    description: The sign-out control is spelled "Terminar sessão" with its diacritic. (Observed at authoring time - it reads "Terminar sessao", and the same control in the dashboard user menu reads "Terminar Sessao", so the two are inconsistent in casing as well as both being misspelled.)
    tags: [content, i18n, polish]
    judgment: false
  - id: forced-state-does-not-silently-break-app
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: forced
    description: >-
      After the actions, an account that still owes a password change is not allowed to wander into
      the app in a half-dead state. Navigating to another section must either bounce the user back
      to this screen or work normally - it must NOT render the page shell and then leave every
      data-driven region stuck on "A carregar..." forever with no explanation.
      (Observed at authoring time - this is exactly what happens: every list in the app hangs while
      the flag is set, and nothing tells the user why.)
    actions:
      - navigate to /automations
    tags: [functionality, ux, error-handling]
    judgment: false
states:
  - id: forced
    label: First-login forced password change
    reachPath:
      - id: seeded-admin
        description: >-
          sign in as an account that still carries the first-login password-change requirement (on
          a freshly booted dev stack the seeded "admin" / "tmp12345" is in exactly this state), so
          the card renders with the "Deve alterar a palavra-passe antes de continuar" subtitle
