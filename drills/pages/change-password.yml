id: change-password
title: Alterar Palavra-passe
path: /change-password
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The page shows the "Alterar Palavra-passe" heading with its "Atualize a palavra-passe da sua conta" subtitle.
    tags: [functionality]
    judgment: false
    assertion: { kind: text-contains, text: "Alterar Palavra-passe" }
    assertionSource: authored
  - id: current-password-field
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Palavra-passe Atual" field is present - changing the password requires proving knowledge of the current one.
    tags: [functionality, security]
    judgment: false
    assertion: { kind: visible, label: "Palavra-passe Atual" }
    assertionSource: authored
  - id: new-password-field
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Nova Palavra-passe" field is present.
    tags: [functionality]
    judgment: false
    assertion: { kind: visible, label: "Nova Palavra-passe" }
    assertionSource: authored
  - id: confirm-password-field
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Confirmar Nova Palavra-passe" field is present.
    tags: [functionality]
    judgment: false
    assertion: { kind: visible, label: "Confirmar Nova Palavra-passe" }
    assertionSource: authored
  - id: submit-disabled-when-empty
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: With the form empty, the "Atualizar Palavra-passe" button is disabled.
    tags: [functionality, validation]
    judgment: false
    assertion: { kind: attribute-equals, role: button, name: "Atualizar Palavra-passe", attribute: disabled, value: "" }
    assertionSource: authored
  - id: back-link-present
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Voltar ao Dashboard" escape link is present so the user is never trapped on this page.
    tags: [functionality, navigation]
    judgment: false
    assertion: { kind: visible, role: link, name: "Voltar ao Dashboard" }
    assertionSource: authored
  - id: all-fields-have-reveal-toggle
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: Each of the three password fields offers its own "Mostrar palavra-passe" reveal toggle.
    tags: [ux, accessibility]
    judgment: false
    assertion: { kind: count, role: button, name: "Mostrar palavra-passe", op: gte, value: 3 }
    assertionSource: authored
  - id: mismatch-rejected
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, entering a new password and a different confirmation does not change the password - the page shows a clear message that the two do not match (or keeps the submit disabled), and does not report success.
    actions:
      - fill the "Palavra-passe Atual" field with "tmp12345"
      - fill the "Nova Palavra-passe" field with "novaSenha123"
      - fill the "Confirmar Nova Palavra-passe" field with "outraSenha456"
      - click the "Atualizar Palavra-passe" button
    tags: [functionality, validation, security]
    judgment: false
  - id: wrong-current-password-rejected
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, submitting a wrong current password produces a clear error and leaves the password unchanged. The error must not disclose whether the account exists or reveal any stored value.
    actions:
      - fill the "Palavra-passe Atual" field with "estaEstaErrada999"
      - fill the "Nova Palavra-passe" field with "novaSenha123"
      - fill the "Confirmar Nova Palavra-passe" field with "novaSenha123"
      - click the "Atualizar Palavra-passe" button
    tags: [functionality, security]
    judgment: false
  - id: reveal-toggle-works
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, pressing the reveal toggle on the "Nova Palavra-passe" field switches that field from dots to readable plaintext, and only that field - the other two stay masked.
    actions:
      - fill the "Nova Palavra-passe" field with "novaSenha123"
      - click the "Mostrar palavra-passe" toggle on the "Nova Palavra-passe" field
    tags: [ux]
    judgment: false
  - id: back-link-returns-to-app
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, "Voltar ao Dashboard" navigates back into the authenticated app (the dashboard chrome with its sidebar), not to the login screen.
    actions:
      - click the "Voltar ao Dashboard" link
    tags: [functionality, navigation]
    judgment: false
  - id: card-polish
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: The centred card on the dark branded background is well composed - the shield icon, heading and subtitle stack tightly, the three fields share equal width and spacing with a divider isolating the current-password field from the new pair, and the footer wordmark sits clear of the card.
    tags: [visual, polish]
    judgment: true
