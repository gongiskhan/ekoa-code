id: users
title: Utilizadores e Equipas (Settings tab)
path: /settings/users
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page shows the "Utilizadores e Equipas" heading with its "Gerir
      utilizadores e equipas" subtitle.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Utilizadores e Equipas
  - id: add-user-button-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The "Adicionar Utilizador" button is present in the page header.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      role: button
      name: Adicionar Utilizador
  - id: search-box-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The "Pesquisar utilizadores." search box is present above the table.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      placeholder: Pesquisar utilizadores.
  - id: table-headers-present
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The users table renders its column headers, including NOME DE UTILIZADOR.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: NOME DE UTILIZADOR
  - id: role-badge-rendered
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The admin row shows its role as a "Super Administrador" badge rather than
      a raw role key.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Super Administrador
  - id: add-user-dialog-opens
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, a create-user dialog or form opens with the fields
      needed to add a user (at minimum a username and a role selector) and
      explicit save / cancel controls.
    actions:
      - id: __act-0
        description: click the "Adicionar Utilizador" button
        resolved:
          kind: click
          role: button
          name: Adicionar Utilizador
    tags:
      - functionality
    judgment: false
    spec: tests/drills/users.spec.ts#add-user-dialog-opens
    assertion:
      kind: visible
      role: dialog
      name: Adicionar Utilizador
  - id: search-filters-table
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, typing a string that matches no user leaves the table
      with no matching rows and a clear "no results" indication - it does not
      keep showing every user, and it does not blank out into an error.
    actions:
      - id: __act-0
        description: type "zzzznotauser" into the "Pesquisar utilizadores." search box
        resolved:
          kind: fill
          role: textbox
          name: Pesquisar utilizadores...
          value: zzzznotauser
    tags:
      - functionality
      - search
    judgment: false
    spec: tests/drills/users.spec.ts#search-filters-table
    assertion:
      kind: text-contains
      text: Nenhum utilizador corresponde à sua pesquisa.
  - id: active-toggle-feedback
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, toggling a user's ATIVO switch visibly changes the row
      state (the switch and its "Ativo" label update) and gives feedback that
      the change was saved - it never leaves the switch mid-state with no
      confirmation.
    actions:
      - id: __act-0
        description: click the ATIVO toggle switch on the admin row
        resolved:
          kind: click
          selector: tbody tr td:nth-child(4)
    tags:
      - functionality
    judgment: false
  - id: created-and-last-login-populated
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The CRIADO and ULTIMO LOGIN cells show real dates for an account that
      exists and has just signed in. Empty dash placeholders in both columns for
      the signed-in admin are a failure.
    tags:
      - functionality
      - data
    judgment: false
  - id: row-actions-labelled
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The AÇÃO column's icon-only buttons are identifiable - each has a visible
      tooltip or accessible label on hover so the user can tell what it does
      before clicking.
    actions:
      - hover over the first icon button in the AÇÃO column of the admin row
    tags:
      - ux
      - accessibility
    judgment: true
  - id: table-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page reads cleanly - the "Visão geral" summary bar, the UTILIZADORES
      section header with its search box, and the table below share consistent
      horizontal margins; the avatar, role badge and token-usage pill are
      vertically centred within their row.
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/users.spec.ts#table-polish
  - id: table-resolves
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The users table settles into a real result - at minimum the signed-in
      account's own row, since a user looking at this page necessarily exists.
      It must not stop at the heading and the "Adicionar Utilizador" button with
      no table beneath.
    tags:
      - functionality
      - loading
    judgment: false
    spec: tests/drills/users.spec.ts#table-resolves
    assertion:
      kind: text-contains
      text: admin
  - id: user-list-does-not-fake-empty
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page never claims the organisation has no users. Whoever is reading
      this page is themselves a user of it, so "Nenhum utilizador ainda.
      Adicione o primeiro utilizador." is always false here - a read that failed
      must surface as a retryable error, not as an authoritative statement that
      the account list is empty. The tell is that empty copy sitting directly
      below a red error banner.
    tags:
      - functionality
      - error-handling
      - data-integrity
    judgment: false
    spec: tests/drills/users.spec.ts#user-list-does-not-fake-empty
    assertion:
      kind: visible
      selector: table tbody tr
  - id: overview-counts-are-not-fabricated
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The "Visão geral" summary bar never presents counts it does not have.
      Reading "0 utilizadores", "0 administrador" and "0 ativo" on a page being
      viewed BY an active administrator is a stated falsehood, not a neutral
      default - when the underlying request failed, the summary must show a
      dash, a skeleton or nothing at all rather than a confident zero. This is
      the most damaging form of the failure on this page, because a zero reads
      as a fact the user can act on.
    tags:
      - functionality
      - data-integrity
    judgment: false
    spec: tests/drills/users.spec.ts#overview-counts-are-not-fabricated
    assertion:
      kind: text-contains
      text: 1 utilizadores
  - id: overview-counts-pluralise
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The "Visão geral" counters agree in number with the figure they follow, in
      both directions: a count other than one reads the plural
      ("administradores", "ativos", never "0 administrador" or "0 ativo"), and a
      count of exactly one reads the singular ("1 utilizador", never "1
      utilizadores"). Portuguese inflects the noun after a numeral, so either
      mismatch is a grammatical defect on a summary bar that is one of the first
      things the eye lands on.
    authoringObservation:
      kind: snapshot
      observedAt: '2026-08-07T06:45:01.724Z'
      conditions:
        - observedAt: '2026-08-07T06:45:01.724Z'
          requestedPath: /settings/users
          finalPath: /settings/users
          requestedOrigin: http://localhost:3000
          finalOrigin: http://localhost:3000
          actionsSinceOpen: 0
          viewport:
            id: desktop
            width: 1280
            height: 800
          quiet:
            outcome: budget-exhausted
            waitedMs: 4002
            quietForMs: 600
            readyState: complete
            networkQuiet: true
            domStable: false
            timedOut: true
            budgetMs: 4000
            pendingRequests: 0
            persistentRequests: 2
          browserContext:
            persistentProfile: true
            tabAgeMs: 605036
            navigationAgeMs: 4138
          source: open
          networkSummary:
            total: 27
            pending: 0
            persistent: 2
            non2xx: 2
            redirects: 0
            notModified: 2
            httpErrors: 0
            otherNon2xx: 0
            transportFailures: 1
            completed2xx: 22
            historyDroppedCount: 914
            historyKnown: true
            historyTruncated: false
    tags:
      - i18n
      - copy
      - polish
    judgment: false
  - id: load-error-is-in-portuguese
    area: 0
    mode: vision
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      If the user list fails to load, the message shown is Portuguese and
      written for a person - it says the list could not be loaded and offers the
      retry. A raw English developer string is a defect in a product that is
      otherwise Portuguese throughout, and a millisecond timeout figure is not
      something to quote at the user. (Observed defect at authoring time - the
      banner read literally "Request timed out after 120000ms", in English,
      beside a Portuguese "Tentar novamente" link.) NOTE 2026-08-05: the
      authoring-time observation behind this check was a dev-harness artifact (a
      leaking CORS proxy), not a product hang - the page renders normally in a
      clean browser. The CHECK stands: web/lib/api/core.ts really can surface a
      raw English timeout string and a failed read really must not render as an
      empty state, so this is kept as the guard for those paths.
    tags:
      - i18n
      - error-handling
      - ux
    judgment: false
  - id: search-placeholder-not-truncated
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The search box's placeholder is a well-formed phrase. It currently reads
      "Pesquisar utilizadores." ending in a single full stop, which reads as a
      truncated ellipsis - every other search field in this product ends in
      "..." (compare "Pesquisar memórias..." on Memória). Either the ellipsis or
      no trailing punctuation at all is correct; a lone period is neither.
    tags:
      - copy
      - polish
      - i18n
    judgment: false
    spec: tests/drills/users.spec.ts#search-placeholder-not-truncated
    assertion:
      kind: visible
      role: textbox
      name: Pesquisar utilizadores...
