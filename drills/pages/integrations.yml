id: integrations
title: Integrações
path: /integrations
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The page shows the "Integrações" heading with the integration count subtitle.
    tags: [functionality]
    judgment: false
    assertion: { kind: text-contains, text: "Integrações" }
    assertionSource: authored
  - id: three-tabs-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The three tabs "Integrações da Plataforma", "Minhas Integrações" and "Webhooks" are present.
    tags: [functionality, navigation]
    judgment: false
    assertion: { kind: visible, role: tab, name: "Webhooks" }
    assertionSource: authored
  - id: refresh-action-present
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The page header offers an "Atualizar" refresh action, so a user whose catalogue failed to load has a way to retry without a full page reload.
    tags: [functionality, ux]
    judgment: false
    assertion: { kind: visible, role: button, name: "Atualizar" }
    assertionSource: authored
  - id: search-box-visible
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      The platform tab renders its filter row above the card grid - the "Pesquisar integrações."
      search box and the Todas / Ativadas / Configuradas / Disponíveis count chips. A catalogue of
      this size is unusable without them.
      (Observed defect at authoring time - no search box and no count chips are rendered at all;
      the tab goes straight from the description line to the cards.)
    tags: [functionality, ux]
    judgment: false
  - id: platform-grid-resolves
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      Every card in the platform grid settles into a real integration - a logo, a name, a
      description and a status pill. Grey skeleton placeholder cards still sitting in the grid once
      the page has loaded are a failure, not a slow success.
      (Observed defect at authoring time - only the first three cards resolve; the remaining rows
      stay as grey skeletons indefinitely.)
    tags: [functionality, loading]
    judgment: false
  - id: platform-cards-present
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The platform tab lists the built-in integrations - Google Workspace is among the cards.
    tags: [functionality]
    judgment: false
    assertion: { kind: text-contains, text: "Google Workspace" }
    assertionSource: authored
  - id: connect-buttons-present
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: Unconnected account integrations (Google Workspace, Microsoft 365) each offer a "Ligar" connect button.
    tags: [functionality]
    judgment: false
    assertion: { kind: count, role: button, name: "Ligar", op: gte, value: 2 }
    assertionSource: authored
  - id: webhooks-tab-shows-webhooks-panel
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the URL carries tab=webhooks and the panel shows the "Webhooks" heading, its description about routing external events to an artifact backend, a "Criar webhook" button, and (with no webhooks yet) the "Ainda não existem webhooks" empty-state message.
    actions:
      - click the "Webhooks" tab
    tags: [functionality, navigation]
    judgment: false
  - id: create-webhook-dialog-opens
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, the "Novo webhook" dialog is open with an "Integração" select, an "Evento" field, an "Artefacto de destino" select, a "Função do backend" field, and Cancelar / Criar buttons.
    actions:
      - click the "Webhooks" tab
      - click the "Criar webhook" button
    tags: [functionality]
    judgment: false
  - id: my-integrations-tab-renders
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the "Minhas Integrações" panel renders real content - either the user's connected integrations or a clear empty-state message - never a blank area or an error.
    actions:
      - click the "Minhas Integrações" tab
    tags: [functionality, navigation]
    judgment: false
  - id: search-filters-integrations
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the card grid narrows to integrations matching "Google" (Google Workspace remains; unrelated cards such as Ifthenpay disappear).
    actions:
      - type "Google" into the "Pesquisar integrações." search box
    tags: [functionality, search]
    judgment: false
  - id: cards-grid-polish
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: Integration cards form a tidy uniform grid - provider logos render (no broken images), status pills ("Não ligado", "Disponíveis") are consistently styled, card descriptions truncate cleanly, and the count chips row (Todas / Ativadas / Configuradas / Disponíveis) is aligned with the search box.
    tags: [visual, polish]
    judgment: true
