id: automations
title: Automatizações (list)
path: /automations
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The page shows the "Automatizações" heading.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: text-contains
      text: Automatizações
    assertionSource: authored
  - id: create-cta-visible
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The "Criar automatização" call-to-action button is present.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: visible
      role: button
      name: Criar automatização
    assertionSource: authored
  - id: on-automations-url
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: The browser stays on the /automations route.
    tags:
      - functionality
    judgment: false
    assertion:
      kind: url-matches
      pattern: /automations
    assertionSource: authored
  - id: content-renders-not-stuck-loading
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page settles into real content - either the empty state ("Ainda não há
      automatizações" with its explanatory copy) or a list of automation
      entries. It is never a blank page or a spinner that stays on "A carregar
      automatizações...".
    tags:
      - functionality
    judgment: false
    spec: tests/drills/automations.spec.ts#content-renders-not-stuck-loading
    assertion:
      kind: text-contains
      text: Ainda não há automatizações
  - id: header-survives-loading
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      While the automations list is still fetching, the page header stays on screen - the icon tile,
      the "Automatizações" title, its subtitle and the "Criar automatização" action. The loading
      state belongs to the list region only. Replacing the entire content area with a centred
      spinner strips the user of the section title and of the primary action, so a user who wants to
      create an automation has nothing to click for as long as the fetch takes.
      (Observed defect at authoring time - the whole content area is replaced by "A carregar
      automatizações...", and the fetch never returns.)
    tags: [functionality, ux, loading]
    judgment: false
  - id: heading-not-satisfied-by-loading-text
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      "Automatizações" appears on this page as the page TITLE in the header, rendered as a heading -
      not merely as a word inside the "A carregar automatizações..." spinner caption. A page whose
      only occurrence of its own name is inside a loading message has not rendered its header.
    tags: [functionality, visual]
    judgment: false
  - id: create-cta-navigates-to-new
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      After the action, the browser is on /automations/new and the "Nova
      automatização" form is shown.
    actions:
      - id: __act-0
        description: click the "Criar automatização" button
        resolved:
          kind: click
          role: button
          name: Criar automatização
    tags:
      - functionality
      - navigation
    judgment: false
    spec: tests/drills/automations.spec.ts#create-cta-navigates-to-new
    assertion:
      kind: url-matches
      pattern: /automations/new
      mode: contains
  - id: empty-state-polish
    area: 0
    mode: e2e
    enabled: true
    viewports:
      - desktop
    state: default
    description: >-
      The page content is centred and balanced - the icon, heading, explanatory
      paragraph and CTA form one coherent, readable block (or, when automations
      exist, the entries form a tidy, consistently spaced list); nothing is
      misaligned, clipped or floating oddly in the whitespace.
    tags:
      - visual
      - polish
    judgment: true
    spec: tests/drills/automations.spec.ts#empty-state-polish
  - id: list-resolves
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: >-
      The automations panel settles into a real result - either a list of automations or the
      written empty state ("Ainda não há automatizações"). It must NOT still be showing
      "A carregar automatizações..." once the page has settled; a loader that never resolves is a
      failure, not a slow success.
      (Observed at authoring time - the page stays on "A carregar automatizações..." indefinitely
      while the API answers the same request in milliseconds.)
    tags: [functionality, loading]
    judgment: false
spotter:
  stability:
    step-end:
      decision: drop
      runs: 1
      lastRunId: 01KYNADECP6S8AMQSNM0360AZP
      annotation: Identical to frame-0001; redundant duplicate of the loaded empty state.
  rules: []
