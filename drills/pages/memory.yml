id: memory
title: Memória (agent knowledge store)
path: /memory
mode: steps
areas: []
steps:
  - id: heading-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The page shows the "Memória" heading with its subtitle about knowledge learned from agent interactions.
    tags: [functionality]
    judgment: false
    assertion: { kind: text-contains, text: "Memória" }
    assertionSource: authored
  - id: add-memory-button-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Adicionar Memória" button is present in the page header.
    tags: [functionality]
    judgment: false
    assertion: { kind: visible, role: button, name: "Adicionar Memória" }
    assertionSource: authored
  - id: search-box-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The "Pesquisar memórias..." search box is present in the filter bar.
    tags: [functionality]
    judgment: false
    assertion: { kind: visible, placeholder: "Pesquisar memórias..." }
    assertionSource: authored
  - id: filter-selects-visible
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The filter bar offers the type filter ("Todos os tipos") alongside scope and visibility filters.
    tags: [functionality]
    judgment: false
    assertion: { kind: text-contains, text: "Todos os tipos" }
    assertionSource: authored
  - id: tabs-present
    area: 0
    mode: e2e
    enabled: true
    viewports: [desktop]
    state: default
    description: The tab row includes "Guardrails" alongside Visão geral, Sempre ativa, Padroes recentes and Configurações.
    tags: [functionality, navigation]
    judgment: false
    assertion: { kind: text-contains, text: "Guardrails" }
    assertionSource: authored
  - id: add-memory-dialog-opens
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the "Adicionar Memória" dialog is open with Titulo, Tipo, Conteudo, Etiquetas, Visibilidade and Ambito fields plus Cancelar / Guardar buttons.
    actions:
      - click the "Adicionar Memória" button
    tags: [functionality]
    judgment: false
  - id: save-requires-title
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions - filling only the content and pressing Guardar with the Titulo left empty - the dialog stays open AND the user is told why, through a visible validation message or an error highlight on the Titulo field. A silent no-op with no feedback fails this check. (Observed at authoring time - saving without a title silently did nothing.)
    actions:
      - click the "Adicionar Memória" button
      - fill the "Conteudo" field with "O cliente prefere respostas curtas e directas."
      - click the "Guardar" button
    tags: [functionality, validation, ux]
    judgment: false
  - id: create-memory-adds-card
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the actions, the dialog closes and the new memory appears as a card in the list showing the title "Preferência de tom do cliente" and the content text, and the Total counter reflects at least 1 memory.
    actions:
      - click the "Adicionar Memória" button
      - fill the "Titulo" field with "Preferência de tom do cliente"
      - fill the "Conteudo" field with "O cliente prefere respostas curtas e directas."
      - click the "Guardar" button
    tags: [functionality]
    judgment: false
  - id: memory-card-date-valid
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: populated
    description: Each memory card's footer shows a real, readable date - never the literal string "Invalid Date". (Observed defect at authoring time - a just-created memory rendered "Invalid Date".)
    tags: [functionality, ux]
    judgment: false
  - id: memory-card-title-not-clipped
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: populated
    description: A memory card's title is readable - it is not truncated with an ellipsis while wide empty space remains beside it in the card, and the card's badges (type, usage mode, origin) sit on tidy rows rather than overlapping or wrapping mid-word.
    tags: [visual, polish]
    judgment: true
  - id: how-it-works-expands
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the "Como funciona a Memória" panel expands and reveals explanatory text about how memory works (it is a collapsible disclosure, not a dead header).
    actions:
      - click the "Como funciona a Memória" panel header
    tags: [functionality]
    judgment: false
  - id: guardrails-tab-renders
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the Guardrails tab is selected and its panel renders real content - a guardrails list or a clear empty state - never a blank region or an error.
    actions:
      - click the "Guardrails" tab
    tags: [functionality, navigation]
    judgment: false
  - id: settings-tab-renders
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: After the action, the "Configurações" tab is selected and shows memory configuration controls, not a blank panel.
    actions:
      - click the "Configurações" tab
    tags: [functionality, navigation]
    judgment: false
  - id: empty-state-copy
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: When no memories exist the page shows the "Sem memórias" empty state with its explanation and an "Adicionar Memória" call to action, centred and legible. (If memories already exist this check does not apply - the list renders instead.)
    tags: [ux]
    judgment: true
  - id: page-polish
    area: 0
    mode: vision
    enabled: true
    viewports: [desktop]
    state: default
    description: The page reads as one coherent layout - the header, the collapsible info panel, the tab row, the totals bar and the filter bar are consistently spaced full-width blocks, and the memory cards below align to the same grid without stray gaps.
    tags: [visual, polish]
    judgment: true
states:
  - id: populated
    label: At least one memory exists in the list
    reachPath:
      - id: open-dialog
        description: click the "Adicionar Memória" button
      - id: fill-title
        description: fill the "Titulo" field with "Preferência de tom do cliente"
      - id: fill-content
        description: fill the "Conteudo" field with "O cliente prefere respostas curtas e directas."
      - id: save
        description: click the "Guardar" button and wait for the dialog to close
