app:
  name: Ekoa
  url: http://localhost:3000
fullDrill: false
autonomy: gated
viewports:
  - desktop
globalRules: >-
  The product UI is Portuguese (pt-PT) throughout - any English string in the
  interface chrome, navigation, headings or messages is a defect unless the page
  is demonstrably a third-party embed. Every authenticated page shares the same
  shell: a dark icon rail on the left (expandable to labelled navigation), a top
  bar carrying the office name, the token meter, the language switcher and the
  user menu, and a page header made of an icon tile, a large title and a
  one-line grey subtitle. Pages are built from full-width cards with consistent
  horizontal margins. Dates must always render as real formatted dates -
  "Invalid Date", raw epochs and empty dashes for records that do have a date
  are defects. Destructive or irreversible actions (revoking a key, resetting a
  quota or a brand, deleting) must confirm or give explicit feedback, never act
  silently. Loading states must resolve: a page that stays on a spinner is a
  failure, not a slow success. Zero browser console errors is the bar on every
  page. Do not treat decorative emoji as acceptable UI - this product uses SVG
  icons.
dispatch: manual
auth:
  loginPath: /login
  steps:
    - fill the "Nome de utilizador" field with "admin"
    - fill the "Palavra-passe" field with "tmp12345"
    - click the "Entrar" button
  success: >-
    the dashboard shell is visible (dark icon sidebar plus the top bar with the
    token meter and user menu) and no login form remains
  cacheMinutes: 720
pages:
  - id: activate
    title: Authorize this device (CLI device activation)
    path: /activate
    mode: steps
    selected: true
  - id: artifacts
    title: Os Meus Artefactos (artifact gallery)
