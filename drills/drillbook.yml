app:
  name: Ekoa
  url: http://localhost:3000
fullDrill: true
autonomy: auto
viewports:
  - desktop
globalRules: >-
  The product UI is Portuguese (pt-PT) throughout - any English string in the
  interface chrome, navigation, headings or messages is a defect unless the page
  is demonstrably a third-party embed. Portuguese diacritics are part of that
  bar: "sessao", "maiuscula", "minuscula", "numero", "revisao", "sera",
  "interacoes", "Padroes" or "ambitos" written without their accents are
  spelling defects, not stylistic choices. European Portuguese is the register:
  the Brazilian "Carregando..." is wrong where the rest of the product says "A
  carregar...", and Brazilian gerund progressives ("Carregando", "Processando",
  "Planejando", "Construindo") are wrong where pt-PT uses "a + infinitive" ("A
  carregar", "A processar", "A planear", "A construir"). The language switcher
  is a single toggle in the top bar, not a menu - one click swaps PT<->EN and a
  second click swaps back. It must translate the whole page, not just the shell:
  a page in two languages at once is a defect on whichever page it is seen, and
  the bar is that no Portuguese string survives a page switched to EN -
  headings, field labels, table column headers, sub-navigation tabs and body
  copy included. Hardcoded JSX text that never reaches the locale files is the
  usual cause. Every authenticated page shares the same shell: a dark icon rail
  on the left (expandable to labelled navigation), a top bar carrying the office
  name, the token meter, the language switcher and the user menu, and a page
  header made of an icon tile, a large title and a one-line grey subtitle. The
  top bar's token meter must resolve to a real figure (e.g. "0/10.0M") - a grey
  skeleton pill still showing after the page has settled is an unresolved
  loading state. Pages are built from full-width cards with consistent
  horizontal margins. Dates must always render as real formatted dates -
  "Invalid Date", raw epochs and empty dashes for records that do have a date
  are defects. Destructive or irreversible actions (revoking a key, resetting a
  quota or a brand, deleting) must confirm or give explicit feedback, never act
  silently. Loading states must resolve: any region left on "A carregar...",
  "Carregando..." or a spinner after the page has settled is a failure, not a
  slow success, and the same goes for a submit button whose spinner never
  returns to its resting label. Zero browser console errors is the bar on every
  page - and note that this app can fail a fetch without logging anything (the
  web client swallows a contract mismatch into a silent fallback), so an empty
  console is not by itself evidence that the page worked. Equally, a region
  still on a spinner is not proof of a product defect: confirm the request
  actually hung, because a freshly-booted `next dev` compiles each route on
  first visit and a screenshot taken mid-compile looks identical to a hung
  fetch. Do not treat decorative emoji as acceptable UI - this product uses SVG
  icons.
dispatch: manual
auth:
  loginPath: /login
  steps:
    - fill the "Nome de utilizador" field with "admin"
    - >-
      fill the "Palavra-passe" field with "tmp12345". This is the password a
      FRESHLY BOOTED stack seeds - the dev database is an in-memory Mongo wiped
      and re-seeded on every stack restart, so "tmp12345" is correct again after
      any restart.
    - >-
      click the "Entrar" button. Sign-in is not instant on this dev stack - the
      login request has been measured between about 0.4s and 4.7s - so give the
      "Entrar" spinner a few seconds before judging it stuck.
    - >-
      if "Credenciais inválidas." appears, this long-lived stack instance has
      had its admin password rotated by an earlier run: fill ONLY the
      "Palavra-passe" field with "Drill#Temp2026" - do NOT retype, clear, or
      touch the "Nome de utilizador" field, it already holds "admin" - then
      click "Entrar" again. (Verified 2026-08-06: this instance answers 401 to
      tmp12345 and grants a session to Drill#Temp2026.)
    - >-
      the seeded admin carries a forced-password-change flag, so this login
      usually lands on /change-password showing "Deve alterar a palavra-passe
      antes de continuar". That screen does NOT have to be cleared: the session
      it hands you is a fully working one. Verified on this stack - with the
      flag still set, /registo rendered its 11 real audit entries and /usage
      rendered the real per-user quota table, both with every API read answering
      200 in about 240ms. So simply navigate on to the page under test (or click
      "Voltar ao Dashboard"); the app does not bounce you back. Do NOT attempt
      the password change to "clear" it: it changes the very credentials this
      Book stores, and this screen has its own known trouble (see the
      change-password page file).
    - >-
      if the login form itself reappears unchanged, or the browser is bounced
      straight to /change-password before any credentials were typed, the tab is
      carrying a stale token from a previous stack instance: click "Terminar
      sessão" (or clear the site's storage), then run the login steps again from
      the top on the freshly rendered /login form.
    - >-
      DEV-STACK TRAP that looks exactly like a product-wide outage, and is not
      one. The dashboard holds several long-lived SSE streams open against the
      API origin. Chrome allows only six concurrent connections per origin over
      HTTP/1.1, which the dev CORS proxy speaks, so once those streams have
      saturated the pool EVERY later fetch to the API simply queues, with no
      error and nothing in the console. The page then shows shells, spinners and
      empty lists while /health reports the API perfectly healthy and a curl to
      the same endpoint answers in single- digit milliseconds. Measured on this
      stack: six attached SSE clients against exactly six Chrome sockets, with
      20 fetches pending behind them. The tell is the network panel - many
      pending requests to the API origin, zero completed, no HTTP errors. It is
      NOT evidence of a broken page. Recover by restarting the browser (a fresh
      context re-renders the same page in full), and prefer one page per fresh
      context when a run is judging data-heavy pages.
  success: >-
    the dashboard shell is visible - the dark icon sidebar plus the top bar
    carrying the office name, the token meter and the user menu - and no login
    form remains. Landing on /change-password still counts as signed in:
    navigate to the page under test and confirm the shell renders there.
  cacheMinutes: 720
