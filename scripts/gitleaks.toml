# gitleaks config (security addendum D.4). Uses the default ruleset plus an Anthropic
# key rule; allowlists synthetic secret-shaped fixtures by VALUE, never by path.
title = "ekoa-code gitleaks"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

# NO path allowlists - by its own argument below. This config used to allowlist `spec/.*`,
# `docs/.*`, `.*\.example\..*`, and `api/test/fake-daemon/fixtures/.*` by path, fifteen lines above
# a comment explaining why path allowlists blind the scanner to a real token pasted into an
# allowlisted tree. Measured 2026-08-22: the four path entries together masked exactly four
# findings, all in the retired `docs/release/evidence/` J-run tree (history-only; the tree is gone
# from the working tree), and the other two path entries masked nothing at all. The four are now
# enumerated by value below and the paths section is gone, so a future secret pasted into docs/, an
# .example file, or anywhere else fails the build like it always should have.
[allowlist]
description = "Enumerated synthetic secret-shaped values - never paths"

# Synthetic credential fixtures in the security suite (Cofre R-*/WS-*).
#
# These are deliberately secret-SHAPED: the suites they live in test that a secret-shaped value is
# redacted, refused, or never echoed, and a fixture that did not look like a credential would prove
# nothing. They tripped `generic-api-key` and had `security-gates` red from 2026-07-27.
#
# Allowlisted by VALUE rather than by path, deliberately. A path allowlist over
# `api/tests/security/**` would be one line instead of five — and would blind the scanner to a REAL
# token pasted into a test file, which is a normal way credentials escape. Enumerating the values
# keeps the gate sharp: a genuine `sk-live-<real>` anywhere, including in these same files, still
# fails the build.
#
# They cannot simply be renamed to something innocuous: `gitleaks detect` scans git HISTORY, so the
# original literal stays reachable in the commit that introduced it. Editing the working tree would
# leave the gate red and the entry still required.
#
# CONVENTION for new fixtures: prefer a value carrying `EKOA-SYNTHETIC-`, which the last regex
# below covers generically, so a new secret-shaped fixture needs no new entry here. Adding a
# one-off value to this list is a deliberate act — the question it forces ("is this really
# synthetic?") is the point.
regexes = [
  '''sk-live-BOUNDARY-TEST-0001''',
  '''sk-live-COFRE-TEST-0001''',
  '''sk-live-EXFILTRATE-ME-0001''',
  '''sk-live-abcdef123456''',
  '''deliver-me-J3-SECRET-9911''',
  # The typist non-memorability fixture (F-5, `api/tests/security/typist-non-memorable.test.ts`).
  # `typistLogin` must write ZERO memory rows, so the suite needs a password-shaped value to prove
  # none of it is retained; binding it to a const named SECRET is what tripped `generic-api-key`.
  # It postdates the EKOA-SYNTHETIC- convention above but did not follow it, and cannot adopt it
  # retroactively: the literal is reachable in the commit that introduced it, and history is what
  # gitleaks scans. Answering the question this list forces: yes, synthetic - it is a local string
  # typed into a mock login form, never a credential for anything.
  '''pw-F5-NONMEMORABLE-0001''',
  # The discovery/replay acceptance fixture's original page-state token (a synthetic ASP.NET
  # __VIEWSTATE miniature, `api/tests/automation/discovery-replay-acceptance.test.ts`). The suite
  # needs a value `looksLikeLiteralSecret` refuses, to prove the recipe store throws rather than
  # persist something it cannot tell from a credential. Same story as pw-F5 above: it postdated the
  # EKOA-SYNTHETIC- convention, did not follow it, and the introducing commit keeps the literal
  # reachable in history. The working-tree fixture NOW carries EKOA-SYNTHETIC-; this entry covers
  # only the historical literal. Synthetic: never a page state, session, or credential for anything.
  '''dDwtMTIzNDU2Nzg5MDtWaWV3U3RhdGUxMjM0NQ''',
  # The four values the retired docs/release/evidence/ path allowlist was masking (see the paths
  # note above). All history-only and all dead: an env-flag false positive ("credentialed,
  # EKOA_LLM_DIRECT=1" read as key=value by generic-api-key), a webhook secret generated by a local
  # ephemeral J-run stack, and a super-admin JWT signed with the dev-only secret, expired 2026-01 -
  # matched by its signature segment, which is unique to that token (allowlisting the shared HS256
  # header prefix would blind the scanner to every future dev JWT).
  '''EKOA_LLM_DIRECT=1''',
  '''a499a336-95cf-4b34-ad2a-34feb52b4bea''',
  '''_uf5SAwosv5esEL1uLq4BYplJIdbZhtUOVveitv4ddI''',
  '''EKOA-SYNTHETIC-[A-Za-z0-9_-]+''',
]
